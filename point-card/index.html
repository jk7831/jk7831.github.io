<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vignesh Hariharan · Point Academy</title>
<meta name="description" content="Vignesh Hariharan, Head of Operations & Business Development at Point Academy.">
<meta name="theme-color" content="#f5f1e8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Victor+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="card.css">
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="who">
    <div class="greet" id="greet"></div>
    <p class="eyebrow"><img src="assets/logo.svg" alt="">Point Academy</p>
    <h1>Hi, I'm <em>Vignesh.</em></h1>
    <p>Tap below to save my contact.</p>
  </div>

  <div class="stage" id="stage">
    <div class="card idle" id="card">
      <div class="flip" id="flip">
        <div class="side front" id="front">
          <div class="wordmark"><b>point</b><img src="assets/logo-dark.svg" alt=""><span>cademy</span></div>
          <img class="mark" src="assets/logo-dark.svg" alt="">
          <ul class="contact">
            <li>vignesh@pointacademy.com<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3z M3 6l9 7 9-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></li>
            <li>pointacademy.com<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></li>
            <li>+ 971 58 297 6643<svg viewBox="0 0 24 24"><path d="M6.6 3.5l2.4 4.6-1.9 1.8a12 12 0 006.9 6.9l1.8-1.9 4.6 2.4-.9 3c-.2.6-.8 1-1.4 1A17.500 17.500 0 013 5.800c0-.6.4-1.200 1-1.400z" fill="currentColor"/></svg></li>
          </ul>
          <h2 class="cname">Vignesh<br>Hariharan</h2>
          <div class="chip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1f1f1f"/><path d="M6 12h11m-4-5l5 5-5 5" fill="none" stroke="#c7efcf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>HEAD OF OPERATIONS &amp; BUSINESS DEVELOPMENT</span></div>
          <img class="qr" src="assets/qr.svg" alt="QR code for this card">
        </div>
        <div class="side back" id="back" hidden>
          <img class="mark" src="assets/logo-dark.svg" alt="">
          <div class="wordmark big"><b>point</b><img src="assets/logo-dark.svg" alt=""><span>cademy</span></div>
        </div>
      </div>
      <img class="art" id="art" src="assets/card-front.png" alt="Vignesh Hariharan - Point Academy business card">
      <div class="holo"></div>
      <div class="glare"></div>
    </div>
  </div>
  <div class="tilt-hint" id="hint">Tilt, drag or tap to flip</div>

  <div class="actions">
    <a class="btn primary" id="save" href="vignesh.vcf" download="Vignesh Hariharan - Point Academy.vcf"><span>Add to Contacts</span><i></i><span aria-hidden="true">→</span></a>
    <a class="btn ghost" href="https://pointacademy.com">Visit pointacademy.com</a>
  </div>

<script>
(function(){
  var card=document.getElementById('card'), stage=document.getElementById('stage'),
      hint=document.getElementById('hint'), root=document.documentElement.style;
  var MAX=14;
  // real card design: drop assets/card-front.png and it replaces the placeholder
  var art=document.getElementById('art');
  art.addEventListener('load',function(){card.classList.add('has-art')});
  if(art.complete&&art.naturalWidth)card.classList.add('has-art');

  // how the page was opened: NFC tap vs QR/link
  try{
    var src=new URLSearchParams(location.search).get('src');
    if(src==='nfc') document.getElementById('greet').textContent='Tapped. Nice to meet you';
  }catch(e){}

  function set(px,py){            // px,py in 0..1
    root.setProperty('--mx',(px*100).toFixed(1)+'%');
    root.setProperty('--my',(py*100).toFixed(1)+'%');
    root.setProperty("--ang",((px*220+py*140)).toFixed(0)+"deg");
    root.setProperty('--ry',((px-.5)*2*MAX).toFixed(2)+'deg');
    root.setProperty('--rx',((.5-py)*2*MAX).toFixed(2)+'deg');
    root.setProperty('--glare',Math.min(1,Math.hypot(px-.5,py-.5)*2.2+.25).toFixed(2));
  }
  function stopIdle(){card.classList.remove('idle');hint.style.opacity=0}
  function reset(){set(.5,.5);root.setProperty('--glare',0)}
  reset();

  // pointer (mouse + touch drag)
  var active=false;
  function pt(e){var r=card.getBoundingClientRect();
    return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]}
  stage.addEventListener('pointerdown',function(e){active=true;stopIdle();var p=pt(e);set(p[0],p[1])});
  stage.addEventListener('pointermove',function(e){if(active||e.pointerType==='mouse'){stopIdle();var p=pt(e);set(p[0],p[1])}});
  window.addEventListener('pointerup',function(){active=false;if(!gyro)reset()});
  stage.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'&&!gyro)reset()});

  // gyroscope (Android works directly; iOS needs a permission tap)
  var gyro=false;
  var front=document.getElementById('front'),back=document.getElementById('back'),flip=document.getElementById('flip'),flipped=false,moved=0;
  stage.addEventListener('pointerdown',function(e){moved=0;stage._x=e.clientX;stage._y=e.clientY});
  stage.addEventListener('pointerup',function(e){if(Math.hypot(e.clientX-stage._x,e.clientY-stage._y)<8)doFlip()});
  function doFlip(){
    flip.style.transition='transform .18s ease-in';flip.style.transform='rotateY(90deg)';
    setTimeout(function(){flipped=!flipped;front.hidden=flipped;back.hidden=!flipped;
      flip.style.transition='transform .18s ease-out';flip.style.transform='rotateY(0deg)'},180);
  }
  function onOrient(e){
    if(e.gamma==null||e.beta==null)return;
    gyro=true;stopIdle();
    var gx=Math.max(-30,Math.min(30,e.gamma))/60+.5,
        gy=Math.max(-30,Math.min(30,e.beta-40))/60+.5;
    set(gx,gy);
  }
  function enableGyro(){
    window.addEventListener('deviceorientation',onOrient,true);
  }
  var D=window.DeviceOrientationEvent;
  if(D&&typeof D.requestPermission==='function'){
    // iOS: ask on the first touch of the card, as required
    stage.addEventListener('click',function once(){
      stage.removeEventListener('click',once);
      D.requestPermission().then(function(s){if(s==='granted')enableGyro()}).catch(function(){});
    });
    hint.textContent='Tap to flip + enable tilt';
  }else if(D){enableGyro()}
})();
</script>
</body>
</html>
