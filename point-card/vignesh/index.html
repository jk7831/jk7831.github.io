<!doctype html>
<html lang="en" style="--accent:#c7efcf">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vignesh Hariharan · Point Academy</title>
<meta name="description" content="Vignesh Hariharan, Head of Operations &amp; Business Development at Point Academy.">
<meta name="theme-color" content="#f2ebdc">
<meta property="og:type" content="website">
<meta property="og:title" content="Vignesh Hariharan · Point Academy">
<meta property="og:description" content="Head of Operations &amp; Business Development. Tap to save my contact.">
<meta property="og:image" content="https://pointacademy-contact.vercel.app/assets/cards/vignesh-front.png">
<meta property="og:url" content="https://pointacademy-contact.vercel.app/vignesh">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="/assets/cards/vignesh-front.png" as="image">
<link rel="stylesheet" href="/brand.css">
<link rel="stylesheet" href="/card.css">
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="who">
    <div class="greet" id="greet"></div>
    <p class="eyebrow"><img src="/assets/logo-dark.svg" alt="">Point Academy</p>
    <h1>Hi, I'm <em>Vignesh.</em></h1>
    <p>Tap below to save my contact.</p>
  </div>

  <div class="stage" id="stage">
    <div class="card idle" id="card">
      <div class="flip" id="flip">
        <img class="side front" id="front" src="/assets/cards/vignesh-front.png" alt="Vignesh Hariharan, Head of Operations &amp; Business Development, Point Academy" width="1344" height="768" decoding="async" fetchpriority="high">
        <img class="side back" id="back" src="/assets/cards/vignesh-back.png" alt="Point Academy" width="1344" height="768" decoding="async" hidden>
      </div>
      <div class="holo"></div>
      <div class="glare"></div>
    </div>
  </div>
  <div class="tilt-hint" id="hint">Tilt, drag or tap to flip</div>

  <div class="actions">
    <a class="btn primary" id="save" href="/vignesh.vcf" download="Vignesh Hariharan - Point Academy.vcf"><span>Add to Contacts</span><i></i><span aria-hidden="true">→</span></a>
    <a class="btn ghost" href="https://pointacademy.com">Visit pointacademy.com</a>
  </div>
<script src="/card.js"></script>
</body>
</html>
